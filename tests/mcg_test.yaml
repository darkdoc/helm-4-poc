suite: Test namespace with default values
templates:
  - templates/configmap.yaml
release:
  name: release-test
tests:

  - it: should output  when defined as list
    documentSelector:
      path: metadata.labels["pattern.name"]
      value: mcg
      matchMany: true
    isKind:
      of: Configmap
    asserts:
      - hasDocuments:
          count: 21 # 3 * 3 * 3 - 2 * 3 * 1  (platform * versions * flavors) (hosted is only available on aws)
          filterAware: true

